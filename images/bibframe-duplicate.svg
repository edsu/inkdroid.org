  <line x1="469" y1="120" x2="608" y2="150" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="538" y="164" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#334155" text-anchor="middle">subtitle</text>

  <line x1="469" y1="370" x2="608" y2="340" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="538" y="328" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#334155" text-anchor="middle">mainTitle</text>
  <line x1="469" y1="390" x2="608" y2="420" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="538" y="434" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#334155" text-anchor="middle">subtitle</text>


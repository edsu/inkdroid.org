  <rect x="610" y="48" width="195" height="44" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.3"/>
  <text x="707" y="76" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#0f172a" text-anchor="middle">"Kuang Shan tu zhi"</text>


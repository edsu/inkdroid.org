  <line x1="115" y1="410" x2="115" y2="281" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="107" y="352" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#334155" text-anchor="end">itemOf</text>

  <!-- ===== literals ===== -->

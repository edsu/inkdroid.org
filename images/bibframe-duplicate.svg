  <ellipse cx="140" cy="250" rx="62" ry="32" fill="#f1f5f9" stroke="#475569" stroke-width="1.7"/>
  <text x="140" y="255" font-size="13" fill="#0f172a" text-anchor="middle">Instance</text>

  <ellipse cx="140" cy="440" rx="52" ry="32" fill="#f1f5f9" stroke="#475569" stroke-width="1.7"/>
  <text x="140" y="445" font-size="13" fill="#0f172a" text-anchor="middle">Item</text>

  <!-- ===== blank nodes ===== -->

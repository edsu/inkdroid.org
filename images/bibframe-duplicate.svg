<svg xmlns="http://www.w3.org/2000/svg" width="875" height="500" viewBox="0 10 875 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="875" height="520" fill="#ffffff"/>

  <!-- ===== the duplicated pair ===== -->
  <line x1="185" y1="228" x2="378" y2="132" stroke="#b45309" stroke-width="1.7" marker-end="url(#ao)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#555"/></marker>
  </defs>

  <rect width="760" height="370" fill="#ffffff"/>

  <!-- ================= column captions ================= -->
  <text x="180" y="28" text-anchor="middle" font-size="13" fill="#6b7280">the music you have</text>
  <text x="580" y="28" text-anchor="middle" font-size="13" fill="#6b7280">the music you bought</text>

  <!-- ================= commands ================= -->
  <rect x="40" y="38" width="280" height="44" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="180" y="60" text-anchor="middle" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3730a3">bandcamp-archiver inv scan</text>
  <text x="180" y="75" text-anchor="middle" font-size="10" fill="#4b5563">reads embedded tags on disk</text>

  <rect x="440" y="38" width="280" height="44" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="580" y="60" text-anchor="middle" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3730a3">bandcamp-archiver sync</text>
  <text x="580" y="75" text-anchor="middle" font-size="10" fill="#4b5563">your Bandcamp purchases</text>

  <line x1="180" y1="82" x2="180" y2="118" stroke="#555" marker-end="url(#a)"/>
  <line x1="580" y1="82" x2="580" y2="118" stroke="#555" marker-end="url(#a)"/>

  <!-- ================= files ================= -->
  <rect x="70" y="124" width="220" height="50" rx="6" fill="#fde68a" stroke="#f59e0b"/>
  <text x="180" y="146" text-anchor="middle" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#7c5b00">inventory.json</text>
  <text x="180" y="163" text-anchor="middle" font-size="10" fill="#7c5b00">documented JSON or CSV</text>

  <rect x="470" y="124" width="220" height="50" rx="6" fill="#fde68a" stroke="#f59e0b"/>
  <text x="580" y="146" text-anchor="middle" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#7c5b00">collection.json</text>
  <text x="580" y="163" text-anchor="middle" font-size="10" fill="#7c5b00">cached from your own session</text>

  <path d="M180,174 V244 H254" fill="none" stroke="#555" marker-end="url(#a)"/>
  <path d="M580,174 V244 H506" fill="none" stroke="#555" marker-end="url(#a)"/>

  <!-- ================= plan ================= -->
  <rect x="260" y="222" width="240" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="380" y="244" text-anchor="middle" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#14532d">bandcamp-archiver plan</text>
  <text x="380" y="259" text-anchor="middle" font-size="10" fill="#166534">read-only: what's missing?</text>

  <line x1="380" y1="266" x2="380" y2="302" stroke="#555" marker-end="url(#a)"/>

  <!-- ================= fetch ================= -->
  <rect x="260" y="308" width="240" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="380" y="330" text-anchor="middle" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e3a8a">bandcamp-archiver fetch</text>
  <text x="380" y="345" text-anchor="middle" font-size="10" fill="#1d4ed8">one album at a time, resumable</text>
</svg>

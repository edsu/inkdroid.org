title: inkdroid 
email: ehs@pobox.com
description: Paper or Plastic 
baseurl: ""
url: "https://inkdroid.org"
twitter_username: edsu
github_username: edsu
permalink: pretty
paginate: 50 
paginate_path: "/page/:num/"
encoding: utf-8

tag_page_layout: tag
tag_page_dir: tags
tag_permalink_style: pretty

# merged into every generated tag page's front matter by jekyll-tagging.
# tag pages are directory listings like the homepage, not prose, so they get
# the wider measure -- otherwise long post titles get ellipsised.
tag_page_data:
  wide: true

exclude:
  - .git
  - utils

keep_files:
  - pagefind

include:
  - .well-known
  - .htaccess

plugins:
  - jekyll-compose
  - jekyll/tagging
  - jekyll-pandoc

markdown: 'Pandoc'

pandoc:
  extensions:
    - mathjax
    - citeproc
    - csl: _styles/apa.csl
    - bibliography: citations.json
    - metadata link-citations:true

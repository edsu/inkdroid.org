# This is kept around for historical purposes just in case I need to remember
# what tags I aligned in my blog and in my bookmark database
#
# ----
#
# Canonical tag vocabulary for inkdroid.org + Shiori.
#
# GENERATED by _scripts/build_tag_alignment.rb -- then reviewed BY HAND.
# Regenerating overwrites this file, so make edits after generating, or
# move your reviewed copy aside first.
#
# Conventions: plural, hyphenated, Shiori's abbreviations win.
#
# Sections
#   canonical:   the target vocabulary. `merge:` lists variants that will be
#                rewritten to the canonical name in shiori.db and in post
#                frontmatter.
#   review:      cases the script refuses to decide. Defects to fix, and
#                groups that look like plural pairs but are not.
#   hyphenation: concatenated tags for a human to split. Fill in `split:`
#                to hyphenate, leave null to keep the tag whole.
#
# Every entry carries `status: proposed`. apply_tag_alignment.rb refuses to
# run on anything still marked proposed -- change to `approved` (act on it)
# or `rejected` (skip it).
#
# counts are {posts, public, shiori} at generation time, informational only.

